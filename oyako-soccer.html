<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>親子サッカー 組み合わせ作成</title>
<style>
  :root{
    --bg:#f5f5f4; --panel:#ffffff; --line:#dedddb; --line2:#ececeb;
    --ink:#333331; --ink2:#6f6e6b; --head:#e7e7e5;
    --oya:#eef2ee; --oyaLine:#9fb3a4; --coach:#f3eef4; --coachLine:#ab9fb3; --lunch:#f0ece3; --blank:#fafafa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Meiryo","メイリオ",sans-serif;font-size:14px;line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:20px;font-weight:700;margin:0 0 4px;letter-spacing:.02em}
  .sub{color:var(--ink2);font-size:12.5px;margin:0 0 22px}
  .cols{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
  @media(max-width:900px){.cols{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);padding:16px 16px 18px}
  .panel h2{font-size:13px;margin:0 0 12px;font-weight:700;color:var(--ink2)}
  .fld{display:flex;justify-content:space-between;align-items:center;gap:10px;
       padding:5px 0;border-bottom:1px solid var(--line2)}
  .fld:last-child{border-bottom:0}
  .fld label{font-size:12.5px;color:var(--ink)}
  .fld input{width:84px;padding:4px 6px;border:1px solid var(--line);background:#fffdf3;
             font-family:inherit;font-size:13px;text-align:center;color:var(--ink)}
  .grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
  .grades div{text-align:center}
  .grades span{display:block;font-size:11.5px;color:var(--ink2);margin-bottom:3px}
  .grades input{width:100%;padding:4px;border:1px solid var(--line);background:#fffdf3;
                text-align:center;font-family:inherit;font-size:13px}
  .btns{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  button{font-family:inherit;font-size:13px;padding:8px 14px;border:1px solid #8d8c88;
         background:#4a4a47;color:#fff;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink)}
  button:hover{opacity:.88}
  table{border-collapse:collapse;width:100%;background:var(--panel);font-size:13px}
  th,td{border:1px solid var(--line);padding:6px 4px;text-align:center}
  thead th{background:var(--head);font-weight:700;font-size:12.5px}
  td.time{background:#f7f7f6;white-space:nowrap;font-weight:700;width:118px}
  td.vs{width:22px;color:var(--ink2)}
  tr.lunch td{background:var(--lunch);font-weight:700}
  tr.close td{background:#f2f2f1;font-weight:700}
  td.oya{background:var(--oya);box-shadow:inset 0 0 0 1px var(--oyaLine)}
  td.coach{background:var(--coach);box-shadow:inset 0 0 0 1px var(--coachLine)}
  td.none{background:var(--blank);color:#bdbcb9}
  .meta{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 10px;font-size:12.5px;color:var(--ink2)}
  .counts{margin-top:18px;font-size:12.5px}
  .counts table{width:auto}
  .counts td,.counts th{padding:4px 12px}
  .msg{margin-top:12px;padding:10px 12px;border-left:3px solid #a8a7a3;background:#fff;font-size:12.5px}
  .msg.bad{border-left-color:#a86b5b}
  textarea.pins{width:100%;height:58px;margin-top:4px;padding:6px 8px;
    border:1px solid var(--line);background:#fffdf3;font-family:inherit;font-size:12.5px;
    color:var(--ink);resize:vertical}
  .hint{font-size:11px;color:var(--ink2);margin-top:4px}
  textarea.tsv{width:100%;height:190px;margin-top:8px;padding:8px;
    border:1px solid var(--line);font-family:"Meiryo","メイリオ",sans-serif;
    font-size:12px;white-space:pre;overflow:auto;background:#fff;color:var(--ink)}
  @media print{
    body{background:#fff}
    .panel.settings,.btns,.sub{display:none}
    .cols{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>親子サッカー 組み合わせ作成</h1>
  <p class="sub">条件を入れて「組み合わせを作る」を押すと、時間割と対戦カードをまとめて作り直します。</p>

  <div class="cols">
    <div class="panel settings">
      <h2>時間</h2>
      <div class="fld"><label>開始時刻</label><input id="start" value="8:30"></div>
      <div class="fld"><label>終了時刻</label><input id="end" value="14:00"></div>
      <div class="fld"><label>1試合（分）</label><input id="dur" value="20"></div>
      <div class="fld"><label>試合間の休憩（分）</label><input id="brk" value="5"></div>
      <div class="fld"><label>昼休憩（分）</label><input id="lunch" value="20"></div>
      <div class="fld"><label>昼休憩を入れる時刻</label><input id="lunchAt" value="11:00"></div>
      <div class="fld"><label>締めの試合（分）</label><input id="close" value="40"></div>
      <div class="fld"><label>父母戦の開始時刻</label><input id="oyaFrom" value="9:00"></div>

      <h2 style="margin-top:18px">学年別のチーム数</h2>
      <div class="grades">
        <div><span>6年</span><input id="g6" value="1"></div>
        <div><span>5年</span><input id="g5" value="0"></div>
        <div><span>4年</span><input id="g4" value="2"></div>
        <div><span>3年</span><input id="g3" value="2"></div>
        <div><span>2年</span><input id="g2" value="2"></div>
        <div><span>1年</span><input id="g1" value="1"></div>
      </div>

      <h2 style="margin-top:18px">コート割</h2>
      <div class="fld"><label>A・Bコートは何年生以上</label><input id="abFrom" value="3"></div>
      <div class="fld"><label>父母の同時試合数</label><input id="oyaPar" value="2"></div>
      <div class="fld"><label>隣の学年を避ける（何年生以上・0＝なし）</label><input id="noAdj" value="3"></div>
      <div class="fld"><label>コーチチームの試合数</label><input id="coachN" value="10"></div>
      <div class="fld"><label>2チーム学年の試合数</label><input id="capMulti" value="5"></div>
      <div class="fld"><label>1チーム学年の試合数</label><input id="capSingle" value="8"></div>
      <div class="fld"><label>午前で終わる学年（0＝なし）</label><input id="amEnd" value="1"></div>
      <div class="fld"><label>連続出場の上限（試合）</label><input id="maxRun" value="2"></div>
      <div class="fld"><label>2年生をA/Bに出す回数</label><input id="swapN" value="2"></div>

      <h2 style="margin-top:18px">時間を指定する試合</h2>
      <textarea id="pins" class="pins" spellcheck="false">10:10 6年生-父母
11:40 6年生-父母</textarea>
      <div class="hint">1行に1試合。「時刻 チーム-チーム」の形で書きます。</div>

      <div class="btns">
        <button onclick="run()">組み合わせを作る</button>
        <button class="ghost" onclick="again()">別の組み合わせ</button>
        <button class="ghost" onclick="downloadXlsx()">Excelでダウンロード</button>
        <button class="ghost" onclick="copyTsv()">Excelにコピー</button>
        <button class="ghost" onclick="print()">印刷</button>
      </div>
    </div>

    <div>
      <div class="meta" id="meta"></div>
      <div id="out"></div>
      <div id="msg"></div>
    </div>
  </div>
</div>

<script>
/* ---------- 補助 ---------- */
const toMin = s => { const m = String(s).trim().match(/^(\d{1,2})[:：](\d{1,2})$/);
  return m ? (+m[1])*60 + (+m[2]) : NaN; };
const toHM = v => Math.floor(v/60) + ":" + String(v%60).padStart(2,"0");
const num = id => parseInt(document.getElementById(id).value, 10);
const val = id => document.getElementById(id).value;
const key = (a,b) => [a,b].sort().join("|");
let seed = 1;
function rnd(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; }
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1));
  [a[i],a[j]]=[a[j],a[i]]; } return a; };

function readPins(){
  const out = [];
  String(val("pins") || "").split(/\n+/).forEach(line => {
    const m = line.trim().match(/^(\d{1,2}[:：]\d{1,2})\s+(.+?)\s*[-ー－]\s*(.+)$/);
    if(m) out.push({t: toMin(m[1]), pair: [m[2].trim(), m[3].trim()]});
  });
  return out;
}

/* ---------- チーム作成 ---------- */
function makeTeams(){
  const out = [];
  for(let g=6; g>=1; g--){
    const n = num("g"+g) || 0;
    if(n === 1) out.push({name:g+"年生", grade:g});
    else for(let i=0;i<n;i++) out.push({name:g+"年生"+"ABCD"[i], grade:g});
  }
  return out;
}

/* ---------- 時間割 ---------- */
function buildSlots(){
  const start=toMin(val("start")), end=toMin(val("end")), dur=num("dur"),
        brk=num("brk"), lunch=num("lunch"), close=num("close"),
        lunchAt=toMin(val("lunchAt"));
  const avail = end - start;
  const R = Math.floor((avail - lunch - close + brk) / (dur + brk));
  if(!(R>0)) return null;
  // 昼休憩を入れる位置＝指定時刻を過ぎる直前の試合の後
  let after = R;
  let t = start;
  for(let i=1;i<=R;i++){
    if(t + dur > lunchAt){ after = Math.max(1, i-1); break; }
    t += dur + brk;
  }
  after = Math.min(after, R-1);
  const slots = []; t = start;
  for(let i=1;i<=R;i++){
    slots.push({no:i, start:t, end:t+dur});
    t += dur + (i===after ? lunch : brk);
  }
  return {R, slots, after, closeStart:t - brk + brk, close, lunch, dur, brk,
          closeEnd: t + close};
}

/* ---------- 対戦カードの元リスト ---------- */
function buildPools(teams, R, oyaRounds, oyaPar, caps, pins){
  const abFrom = num("abFrom");
  const noAdj = num("noAdj") || 0;
  const coachMin = Math.max(0, num("coachN") || 0);
  const capMulti = Math.max(1, num("capMulti") || 5);
  const capSingle = Math.max(1, num("capSingle") || 7);
  const high = teams.filter(t => t.grade >= abFrom);
  const low  = teams.filter(t => t.grade <  abFrom);
  const hasC = low.length > 0;
  const abSlots = hasC ? 2*R : 3*R;
  const cSlots  = hasC ? R : 0;
  const maxOya  = oyaRounds * oyaPar;

  const gCount = {}, gOf = {};
  teams.forEach(t => { gCount[t.grade] = (gCount[t.grade]||0)+1; gOf[t.name] = t.grade; });
  const targetOf = n => caps[n] !== undefined ? caps[n]
        : (gCount[gOf[n]] >= 2 ? capMulti : capSingle);

  // --- コーチチーム（2学年ぶんで1チーム） ---
  const gIn = new Set(teams.map(t => t.grade));
  const coachDefs = [[6,5],[4,3],[2,1]]
    .filter(g => g.some(x => gIn.has(x)))
    .map(g => ({name:`${Math.min(...g)}・${Math.max(...g)}年コーチ`, grades:g}));
  const coachCnt = {}; coachDefs.forEach(c => coachCnt[c.name] = 0);
  const coachEach = coachDefs.length ? Math.max(1, Math.round(coachMin / coachDefs.length)) : 0;

  const cnt = {}, useCnt = {};
  let oyaUsed = 0;
  const bump = m => {
    useCnt[key(m[0],m[1])] = (useCnt[key(m[0],m[1])]||0) + 1;
    m.forEach(n => { if(coachCnt[n] !== undefined) coachCnt[n]++; else cnt[n] = (cnt[n]||0)+1; });
  };
  const d = n => targetOf(n) - (cnt[n]||0);
  // 午前だけのチームは先に組んでおかないと入れられなくなるので優先する
  const w = n => d(n) + (caps[n] !== undefined && d(n) > 0 ? 2 : 0);
  const kk = p => key(p[0], p[1]);

  const pairsOf = list => {
    const p = [];
    for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){
      const a = list[i], b = list[j], gd = Math.abs(a.grade - b.grade);
      if(gd > 3) continue;
      if(coachMin && gd === 0) continue;                       // 同学年はコーチ戦に置き換え
      if(noAdj && gd === 1 && a.grade >= noAdj && b.grade >= noAdj) continue;
      p.push([a.name, b.name]);
    }
    return p;
  };

  function buildCourt(slots, list, base, coachFor){
    const pool = [];
    const own = new Set(list.map(t => t.name));
    for(let i=0;i<slots;i++){
      let best = null, bs = -1e9;
      for(const p of base){                                     // 学年どうし
        if(d(p[0]) <= 0 || d(p[1]) <= 0) continue;
        const outside = p.filter(n => !own.has(n)).length;   // 他学年を借りる組は控えめに
        const s = w(p[0]) + w(p[1]) - outside*2.5 - (useCnt[kk(p)]||0)*2.2 + rnd()*0.5;
        if(s > bs){ bs = s; best = p; }
      }
      if(oyaUsed < maxOya) for(const t of list){                // 父母戦
        if(d(t.name) <= 0) continue;
        const k = key(t.name, "父母");
        const s = w(t.name) + 1.4 - (useCnt[k]||0)*1.1 + rnd()*0.5;
        if(s > bs){ bs = s; best = [t.name, "父母"]; }
      }
      for(const c of coachFor) for(const t of list){            // コーチ戦
        if(!c.grades.includes(t.grade) || d(t.name) <= 0) continue;
        const k = key(t.name, c.name);
        const need = coachCnt[c.name] < coachEach ? 8 : 0;
        const s = w(t.name) + need + 0.7 - (useCnt[k]||0)*1.8 + rnd()*0.5;
        if(s > bs){ bs = s; best = [t.name, c.name]; }
      }
      if(!best){                                                // 目標に届いていても枠が余る場合
        if(oyaUsed < maxOya && list.length){
          const t = list[Math.floor(rnd()*list.length)];
          best = [t.name, "父母"];
        } else if(base.length){
          best = base[Math.floor(rnd()*base.length)].slice();
        } else break;
      }
      pool.push(best.slice());
      useCnt[kk(best)] = (useCnt[kk(best)]||0) + 1;
      best.forEach(n => { if(coachCnt[n] === undefined) cnt[n] = (cnt[n]||0)+1; });
      if(best.includes("父母")) oyaUsed++;
      best.forEach(n => { if(coachCnt[n] !== undefined) coachCnt[n]++; });
    }
    return pool;
  }

  // --- 1試合目は全学年が出られるようにする（2チームある学年はどちらか1チーム） ---
  const byGrade = {};
  teams.forEach(t => (byGrade[t.grade] = byGrade[t.grade] || []).push(t));
  const gradesDesc = Object.keys(byGrade).map(Number).sort((a,b) => b-a);
  const chosen = gradesDesc.map(g => {
    const arr = byGrade[g];
    return arr[Math.floor(rnd()*arr.length)];
  });
  const pairUp = list => {                     // 隣の学年どうしにならないよう半分ずらして組む
    const res = [], n = list.length, half = Math.floor(n/2);
    for(let i=0;i<half;i++) res.push([list[i].name, list[i+half].name]);
    if(n % 2){
      const t = list[n-1];
      const c = coachDefs.find(cd => cd.grades.includes(t.grade));
      res.push([t.name, c ? c.name : "父母"]);
    }
    return res;
  };
  // 時間を指定された試合を先に確保する
  const lowSet = new Set(low.map(t => t.name));
  const pinAB = [], pinC = [];
  (pins || []).forEach(p => {
    (p.pair.some(n => lowSet.has(n)) ? pinC : pinAB).push(p.pair.slice());
    bump(p.pair);
  });

  const firstAB = pairUp(chosen.filter(t => t.grade >= abFrom)).slice(0, hasC ? 2 : 3);
  const firstC  = hasC ? pairUp(chosen.filter(t => t.grade <  abFrom)).slice(0, 1) : [];
  firstAB.concat(firstC).forEach(bump);

  // Cコート（低学年）を先に確定させる
  let cBase = pairsOf(low);
  if(hasC){
    const helpers = high.slice().sort((a,b) => a.grade - b.grade)
                        .filter((t,i,arr) => t.grade === arr[0].grade);
    const minG = Math.min(...low.map(t => t.grade));
    low.filter(l => l.grade > minG)
       .forEach(l => helpers.forEach(h => cBase.push([l.name, h.name])));
  }
  const cCoach = coachDefs.filter(c => c.grades.some(g => g < abFrom));
  const abCoach = coachDefs.filter(c => c.grades.every(g => g >= abFrom));
  const cPool = firstC.concat(pinC,
    hasC ? buildCourt(cSlots - firstC.length - pinC.length, low, cBase, cCoach) : []);
  const abPool = firstAB.concat(pinAB,
    buildCourt(abSlots - firstAB.length - pinAB.length, high, pairsOf(high), abCoach));

  return {abPool, cPool, hasC, high, low, maxOya, firstAB, firstC, lowNames: low.map(t => t.name),
          oyaAB: abPool.filter(m => m.includes("父母")).length,
          oyaC: cPool.filter(m => m.includes("父母")).length,
          coachNames: coachDefs.map(c => c.name),
          coachN: coachDefs.reduce((s,c) => s + coachCnt[c.name], 0)};
}

/* ---------- ラウンドに割り当て ---------- */
function assign(slots, pools, oyaStart, oyaPar, amOnly, lunchIdx, maxRun, pins){
  const pinBy = {};
  (pins || []).forEach(p => (pinBy[p.t] = pinBy[p.t] || []).push(p.pair));
  const lowSet = new Set(pools.lowNames || []);
  const {abPool, cPool, hasC} = pools;
  const ab = shuffle(abPool.slice()), c = shuffle(cPool.slice());
  const last = {}, streak = {}, lastPair = {}, rounds = [];
  const allNames = pools.high.concat(pools.low).map(t => t.name)
                     .concat(pools.coachNames || []);
  const perCourt = hasC ? 2 : 3;

  for(let r=0;r<slots.length;r++){
    const allowOya = slots[r].start >= oyaStart;
    const used = new Set(); let oyaCnt = 0;
    if(r === 0 && (pools.firstAB || []).length){
      const grab = (pool, m) => {
        const i = pool.findIndex(x => key(x[0],x[1]) === key(m[0],m[1]));
        return i < 0 ? null : pool.splice(i,1)[0];
      };
      const row0 = [];
      let okFirst = true;
      for(const m of pools.firstAB){ const g = grab(ab, m); if(!g){ okFirst = false; break; } row0.push(g); }
      if(okFirst && hasC) for(const m of pools.firstC){ const g = grab(c, m); if(!g){ okFirst = false; break; } row0.push(g); }
      if(okFirst && row0.length === perCourt + (hasC ? 1 : 0) - (hasC ? 0 : 0)){
        row0.forEach(m => m.forEach(t => { if(t !== "父母") used.add(t); }));
        used.forEach(t => last[t] = r);
        allNames.forEach(t => streak[t] = used.has(t) ? 1 : 0);
        rounds.push(row0);
        continue;
      }
      if(!okFirst) return null;
    }
    const take = pool => {
      const left = slots.length - r;
      const oyaLeft = pool.filter(m => m.includes("父母")).length;
      const base = pool.filter(m => {
        if(m.some(t => t !== "父母" && used.has(t))) return false;
        if(m.includes("父母") && (!allowOya || oyaCnt >= oyaPar)) return false;
        if(r >= lunchIdx && m.some(t => amOnly.has(t))) return false;
        if(m.some(t => t !== "父母" && (streak[t]||0) >= maxRun)) return false;
        return true;
      });
      // 直前のラウンドと同じカードは避ける
      let cands = base.filter(m => r - (lastPair[key(m[0],m[1])] ?? -9) >= 2);
      if(!cands.length) cands = base;
      if(!cands.length) return null;
      cands.sort((x,y) => score(x) - score(y));
      function score(m){
        let s = 0;
        if(m.includes("父母")) s -= (oyaLeft >= left ? 60 : 12);
        if(m.some(t => amOnly.has(t))) s -= 45;
        for(const t of m) if(t !== "父母") s -= (r - (last[t] ?? -3)) * 3;
        return s + rnd();
      }
      const m = cands[0];
      pool.splice(pool.indexOf(m), 1);
      m.forEach(t => { if(t !== "父母") used.add(t); });
      if(m.includes("父母")) oyaCnt++;
      lastPair[key(m[0], m[1])] = r;
      return m;
    };
    const row = [null, null, null];
    // 時間を指定された試合を先に置く
    for(const pin of (pinBy[slots[r].start] || [])){
      const isLow = hasC && pin.some(t => lowSet.has(t));
      const pool = isLow ? c : ab;
      const i = pool.findIndex(x => key(x[0],x[1]) === key(pin[0],pin[1]));
      if(i < 0) return null;
      const m = pool.splice(i,1)[0];
      let idx = isLow ? 2 : (row[0] === null ? 0 : 1);
      if(row[idx] !== null) return null;
      row[idx] = m;
      m.forEach(t => { if(t !== "父母") used.add(t); });
      if(m.includes("父母")) oyaCnt++;
      lastPair[key(m[0], m[1])] = r;
    }
    if(hasC && row[2] === null) row[2] = take(c);
    for(const k of (hasC ? [0,1] : [0,1,2])) if(row[k] === null) row[k] = take(ab);
    if(row.some(m => m === null)) return null;
    used.forEach(t => last[t] = r);
    allNames.forEach(t => streak[t] = used.has(t) ? (streak[t]||0)+1 : 0);
    rounds.push(row);
  }
  return (ab.length || c.length) ? null : rounds;
}

function quality(rounds, teams, maxRun){
  let pen = 0;
  for(const t of teams){
    const play = rounds.map(rd => rd.some(m => m && m.includes(t.name)));
    let run=0, mx=0; for(const p of play){ run = p?run+1:0; mx = Math.max(mx,run); }
    pen += Math.max(0, mx-(maxRun||3))**2 * 5;
    run=0; mx=0; for(const p of play){ run = p?0:run+1; mx = Math.max(mx,run); }
    pen += Math.max(0, mx-3)**2 * 5;
  }
  for(let i=0;i<rounds.length-1;i++){
    const a = new Set(rounds[i].filter(Boolean).map(m=>key(m[0],m[1])));
    for(const m of rounds[i+1]) if(m && a.has(key(m[0],m[1]))) pen += 40;
    if(i+2 < rounds.length)
      for(const m of rounds[i+2]) if(m && a.has(key(m[0],m[1]))) pen += 10;
  }
  return pen;
}

/* ---------- 低学年をA/Bに、代わりに3年生をCに ---------- */
function applySwaps(rounds, teams, n){
  const abFrom = num("abFrom");
  const gr = {}; teams.forEach(t => gr[t.name] = t.grade);
  const kids = m => m.filter(t => t !== "父母");
  const cOk = m => m && kids(m).every(t => gr[t] >= 2) && kids(m).some(t => gr[t] < abFrom);
  // Cに降ろす側は3年生を基本に、いなければ4年生まで許す
  const abOk = m => m && kids(m).length > 0 && kids(m).every(t => gr[t] <= abFrom + 1);
  const cntSwap = {}, cntC = {}, done = [];
  for(let pass=0; pass<n; pass++){
    let bR = -1, bK = -1, bS = -Infinity;
    for(let r=0;r<rounds.length;r++){
      if(done.includes(r) || !cOk(rounds[r][2])) continue;
      for(const k of [0,1]){
        if(!abOk(rounds[r][k])) continue;
        let sc = rnd();
        kids(rounds[r][2]).filter(t => gr[t] < abFrom)
          .forEach(t => sc -= (cntSwap[t]||0) * 10);
        kids(rounds[r][k]).forEach(t => sc -= (cntC[t]||0) * 10 + (gr[t] - abFrom) * 4);
        done.forEach(d => sc -= Math.max(0, 4 - Math.abs(d - r)) * 3);
        if(sc > bS){ bS = sc; bR = r; bK = k; }
      }
    }
    if(bR < 0) break;
    const tmp = rounds[bR][bK];
    rounds[bR][bK] = rounds[bR][2];
    rounds[bR][2] = tmp;
    kids(rounds[bR][bK]).filter(t => gr[t] < abFrom)
      .forEach(t => cntSwap[t] = (cntSwap[t]||0) + 1);
    kids(rounds[bR][2]).forEach(t => cntC[t] = (cntC[t]||0) + 1);
    done.push(bR);
  }
  return done.length;
}

/* ---------- 実行 ---------- */
let LAST = null;
function again(){ seed = Math.floor(Math.random()*1e9)+1; run(true); }
function run(keepSeed){
  if(!keepSeed) seed = 20260915;
  const msg = document.getElementById("msg");
  msg.className = "msg"; msg.textContent = "";
  const tt = buildSlots();
  if(!tt){ msg.className="msg bad";
    msg.textContent="その時間では1試合も入りません。終了時刻か1試合の時間を見直してください。"; return; }
  const teams = makeTeams();
  if(teams.length < 3){ msg.className="msg bad";
    msg.textContent="チーム数が足りません。合計3チーム以上にしてください。"; return; }

  const oyaStart = toMin(val("oyaFrom"));
  const oyaPar = Math.max(1, num("oyaPar"));
  const oyaRounds = tt.slots.filter(s => s.start >= oyaStart).length;
  const wantRun = Math.max(1, num("maxRun") || 3);
  const amEnd = num("amEnd") || 0;
  const amOnly = new Set(teams.filter(t => t.grade <= amEnd).map(t => t.name));
  const caps = {};
  if(amOnly.size){
    const per = Math.max(1, Math.floor((tt.after - 1) / amOnly.size) + 1);
    // 連続出場の上限に合わせて、午前に入れられる最大試合数を出す
    const fit = tt.after - Math.floor(tt.after / (wantRun + 1));
    amOnly.forEach(n => caps[n] = Math.max(1, Math.min(per, tt.after - 1, fit)));
  }
  const pins = readPins();
  const slotTimes = new Set(tt.slots.map(s => s.start));
  const badPin = pins.find(p => !slotTimes.has(p.t));
  const pools = buildPools(teams, tt.R, oyaRounds, oyaPar, caps, pins);

  let best = null, bq = Infinity, usedRun = wantRun;
  for(let run = wantRun; run <= wantRun + 3 && !best; run++){
    for(let i=0;i<700;i++){
      const rs = assign(tt.slots, JSON.parse(JSON.stringify(pools)), oyaStart, oyaPar,
                        amOnly, amOnly.size ? tt.after : 99, run, pins);
      if(!rs) continue;
      const q = quality(rs, teams, run);
      if(q < bq){ best = rs; bq = q; usedRun = run; if(q === 0) break; }
    }
  }
  if(!best){ msg.className="msg bad";
    msg.textContent="この条件では組み合わせが作れませんでした。父母戦の開始時刻を早めるか、同時試合数を増やしてみてください。"; return; }

  const wantSwap = Math.max(0, num("swapN") || 0);
  const didSwap = (pools.hasC && wantSwap) ? applySwaps(best, teams, wantSwap) : 0;
  LAST = {tt, rounds:best, teams, pools, amOnly, usedRun, didSwap, wantSwap};
  render();
  if(badPin){
    msg.className = "msg bad";
    msg.textContent = `指定した時刻 ${toHM(badPin.t)} に試合枠がありません。時間の設定を見直してください。`;
    return;
  }
  if(usedRun > wantRun){
    msg.textContent = `連続${wantRun}試合では組めなかったので、上限${usedRun}試合で作りました。`;
  } else if(wantSwap && didSwap < wantSwap){
    msg.textContent = `A/Bとの入れ替えは${didSwap}回までしかできませんでした。`;
  }
  if(amOnly.size){
    const late = best.some((rd,i) => i >= tt.after && rd.some(m => m && m.some(t => amOnly.has(t))));
    if(late){ msg.className = "msg bad";
      msg.textContent = "午前だけに収まりませんでした。1試合の時間を短くするか、昼休憩を遅らせてください。"; }
  }
}

function render(){
  const {tt, rounds, teams, pools} = LAST;
  const hasC = pools.hasC;
  let h = '<table><thead><tr><th>時間</th><th colspan="3">Aコート</th>'
        + '<th colspan="3">Bコート</th><th colspan="3">Cコート</th></tr></thead><tbody>';
  rounds.forEach((rd, i) => {
    const s = tt.slots[i];
    h += `<tr><td class="time">${toHM(s.start)}～${toHM(s.end)}</td>`;
    for(let k=0;k<3;k++){
      const m = rd[k];
      if(!m){ h += '<td class="none" colspan="3">－</td>'; continue; }
      const coachSet = new Set(pools.coachNames || []);
      const cls = m.includes("父母") ? ' class="oya"'
                : m.some(t => coachSet.has(t)) ? ' class="coach"' : '';
      h += `<td${cls}>${m[0]}</td><td class="vs">－</td><td${cls}>${m[1]}</td>`;
    }
    h += "</tr>";
    if(i+1 === tt.after){
      h += `<tr class="lunch"><td class="time">${toHM(s.end)}～${toHM(s.end+tt.lunch)}</td>`
         + '<td colspan="9">昼休憩　※出店でのお買い物・お昼ごはんの時間です</td></tr>';
    }
  });
  const cs = tt.closeEnd - tt.close;
  h += `<tr class="close"><td class="time">${toHM(cs)}～${toHM(tt.closeEnd)}</td>`
     + `<td colspan="9">前半${Math.floor(tt.close/2)}分　6年生－父母　／　後半${Math.ceil(tt.close/2)}分　6年生－コーチ</td></tr>`;
  h += "</tbody></table>";

  const cnt = {};
  rounds.forEach(rd => rd.forEach(m => { if(m) m.forEach(t => cnt[t] = (cnt[t]||0)+1); }));
  const order = teams.map(t => t.name).concat(pools.coachNames || [], "父母");
  h += '<div class="counts"><table><thead><tr><th>チーム</th><th>試合数</th>'
     + '<th>うち父母戦</th></tr></thead><tbody>';
  order.forEach(t => {
    const o = rounds.flat().filter(m => m && m.includes(t) &&
              (t === "父母" || m.includes("父母"))).length;
    h += `<tr><td>${t}</td><td>${cnt[t]||0}</td><td>${t==="父母"?"-":o}</td></tr>`;
  });
  h += "</tbody></table></div>";
  document.getElementById("out").innerHTML = h;

  document.getElementById("meta").innerHTML =
    `<span>全${tt.R}試合＋締めの試合</span><span>${toHM(tt.slots[0].start)}開始 / `
    + `${toHM(tt.closeEnd)}終了</span><span>父母戦 ${pools.oyaAB + pools.oyaC}試合</span>`
    + `<span>${hasC ? "Cコート＝低学年" : "3コートとも混合"}</span>`
    + (LAST.amOnly && LAST.amOnly.size
       ? `<span>${[...LAST.amOnly].join("・")}は午前で終了</span>` : "")
    + (LAST.didSwap ? `<span>低学年がA/Bに出る回 ${LAST.didSwap}回</span>` : "")
    + (pools.coachN ? `<span>コーチチーム ${pools.coachN}試合</span>` : "");
}

  lines.push(`${toHM(cs)}～${toHM(tt.closeEnd)}\t前半 6年生－父母 ／ 後半 6年生－コーチ`);
  const text = lines.join("\n");
  const done = () => {
    const m = document.getElementById("msg");
    m.className = "msg";
    m.textContent = "コピーしました。Excelのセルを選んで貼り付けてください。";
  };

    document.getElementById("msg").innerHTML =
      '<div class="msg">下の枠の中をクリックしてCtrl＋C（MacはCommand＋C）でコピーし、'
      + 'Excelのセルを選んで貼り付けてください。</div>';

    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }

/* ===== Excelファイル（.xlsx）を作って保存する ===== */
const CRC_T = (() => { const t = new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1;
    t[n]=c>>>0; } return t; })();
function crc32(buf){ let c = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0; }
const enc = s => new TextEncoder().encode(s);

function zip(files){                     // 無圧縮ZIP（xlsxの中身）
  const parts = [], dir = []; let off = 0;
  const u16 = v => [v & 255, (v>>>8) & 255];
  const u32 = v => [v & 255, (v>>>8) & 255, (v>>>16) & 255, (v>>>24) & 255];
  for(const f of files){
    const nm = enc(f.name), data = enc(f.data), crc = crc32(data);
    const head = [].concat([80,75,3,4], u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(data.length), u32(data.length), u16(nm.length), u16(0));
    parts.push(new Uint8Array(head), nm, data);
    dir.push({nm, crc, len:data.length, off});
    off += head.length + nm.length + data.length;
  }
  const cd = [];
  for(const d of dir){
    const h = [].concat([80,75,1,2], u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(d.crc), u32(d.len), u32(d.len), u16(d.nm.length), u16(0), u16(0), u16(0),
      u16(0), u32(0), u32(d.off));
    cd.push(new Uint8Array(h), d.nm);
  }
  const cdLen = cd.reduce((s,a)=>s+a.length, 0);
  const end = new Uint8Array([].concat([80,75,5,6], u16(0), u16(0),
    u16(dir.length), u16(dir.length), u32(cdLen), u32(off), u16(0)));
  const all = parts.concat(cd, [end]);
  const total = all.reduce((s,a)=>s+a.length, 0);
  const buf = new Uint8Array(total); let p = 0;
  for(const a of all){ buf.set(a, p); p += a.length; }
  return buf;
}

<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`},
    {name:"xl/workbook.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="タイムテーブル" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:"xl/_rels/workbook.xml.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`},
    {name:"xl/styles.xml", data:STYLES},
    {name:"xl/worksheets/sheet1.xml", data:sheetXml()}
  ];
  const buf = zip(files);
  if(typeof window === "undefined") return buf;
  const blob = new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "親子サッカー_タイムテーブル.xlsx";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  const m = document.getElementById("msg");
  m.className = "msg"; m.textContent = "Excelファイルを保存しました。";
}

run();
</script>
